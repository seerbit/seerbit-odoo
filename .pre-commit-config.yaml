repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=120]

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=120, --ignore=E501,W503]

  - repo: https://github.com/pycqa/pylint
    rev: v2.17.0
    hooks:
      - id: pylint
        args: [--disable=C0114,C0115,C0116, --max-line-length=120]

  - repo: local
    hooks:
      - id: xml-format
        name: XML Format Check
        entry: python -c "import xml.etree.ElementTree as ET; [ET.parse(f) for f in ['pos_seerbit/data/account_journal.xml', 'pos_seerbit/views/res_config_settings_views.xml']]"
        language: system
        files: \.xml$
        pass_filenames: false

      - id: csv-check
        name: CSV Format Check
        entry: python -c "import csv; [list(csv.reader(open(f))) for f in ['pos_seerbit/data/pos.payment.method.csv']]"
        language: system
        files: \.csv$
        pass_filenames: false 